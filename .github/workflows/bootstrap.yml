name: Bootstrap GitDroid

on:
  push:
    branches:
      - agent/initial-gitdroid

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/GitDroid-source.tar.gz
          tar -tzf /tmp/GitDroid-source.tar.gz >/dev/null
          mkdir -p /tmp/gitdroid-unpack
          tar -xzf /tmp/GitDroid-source.tar.gz -C /tmp/gitdroid-unpack
          rsync -a --delete --exclude='.git/' /tmp/gitdroid-unpack/GitDroid/ ./
          rm -rf .bootstrap

      - name: Commit readable Android project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build initial GitDroid app'
          git push

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitDroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
